<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Heatmap - Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
        <a href="/heatmap" class="nav-link active">Heatmap</a>
      </nav>
    </div>
  </header>

  <main class="analytics-container heatmap-container">
    <section class="heatmap-page-heading">
      <h1>Activity Heatmap</h1>
    </section>

    <section class="heatmap-summary" id="heatmapStats" aria-live="polite">
      <article class="heatmap-summary-item">
        <p class="heatmap-summary-label">Current Streak</p>
        <p class="heatmap-summary-value" id="statCurrentStreak">
          <span class="heatmap-summary-number">--</span>
          <span class="heatmap-summary-unit">days</span>
        </p>
      </article>
      <article class="heatmap-summary-item">
        <p class="heatmap-summary-label">Longest Streak</p>
        <p class="heatmap-summary-value" id="statLongestStreak">
          <span class="heatmap-summary-number">--</span>
          <span class="heatmap-summary-unit">days</span>
        </p>
      </article>
      <article class="heatmap-summary-item">
        <p class="heatmap-summary-label">Total Completions</p>
        <p class="heatmap-summary-value" id="statTotal">
          <span class="heatmap-summary-number">--</span>
        </p>
      </article>
    </section>

    <section class="heatmap-card">
      <p class="heatmap-error" id="heatmapError" role="alert" hidden></p>
      <div class="heatmap-scroll">
        <div class="heatmap-board" id="heatmapBoard" aria-label="Task completion heatmap for the last 12 weeks"></div>
      </div>
      <div class="heatmap-legend" aria-hidden="true">
        <span class="heatmap-legend-text">Less</span>
        <div class="heatmap-legend-cells">
          <span class="heatmap-cell heatmap-cell--level-0"></span>
          <span class="heatmap-cell heatmap-cell--level-1"></span>
          <span class="heatmap-cell heatmap-cell--level-2"></span>
          <span class="heatmap-cell heatmap-cell--level-3"></span>
          <span class="heatmap-cell heatmap-cell--level-4"></span>
          <span class="heatmap-cell heatmap-cell--level-5"></span>
        </div>
        <span class="heatmap-legend-text">More</span>
      </div>
    </section>
  </main>

  <script src="heatmap.js"></script>
</body>
</html>
