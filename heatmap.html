<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Heatmap - Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
        <a href="/heatmap" class="nav-link active">Heatmap</a>
      </nav>
    </div>
  </header>

  <main class="heatmap-page">
    <section class="heatmap-header">
      <h1>Activity Heatmap</h1>
      <div class="heatmap-stats" aria-label="Heatmap summary statistics">
        <article class="heatmap-stat">
          <p class="heatmap-stat-label">Current Streak</p>
          <p class="heatmap-stat-value"><span id="currentStreakValue">0</span> <span class="heatmap-stat-unit">days</span></p>
        </article>
        <article class="heatmap-stat">
          <p class="heatmap-stat-label">Longest Streak</p>
          <p class="heatmap-stat-value"><span id="longestStreakValue">0</span> <span class="heatmap-stat-unit">days</span></p>
        </article>
        <article class="heatmap-stat">
          <p class="heatmap-stat-label">Total Completions</p>
          <p class="heatmap-stat-value"><span id="totalCompletionsValue">0</span></p>
        </article>
      </div>
    </section>

    <section class="heatmap-card" aria-labelledby="heatmapGridTitle">
      <h2 id="heatmapGridTitle" class="sr-only">Last 12 weeks activity heatmap</h2>
      <div class="heatmap-grid-shell">
        <div class="heatmap-month-labels" id="heatmapMonthLabels" aria-hidden="true"></div>
        <div class="heatmap-grid-row">
          <div class="heatmap-day-labels" aria-hidden="true">
            <span>Mon</span>
            <span>Wed</span>
            <span>Fri</span>
            <span>Sun</span>
          </div>
          <div class="heatmap-grid" id="heatmapGrid"></div>
        </div>
      </div>
      <div class="heatmap-legend">
        <span>Less</span>
        <div class="heatmap-legend-cells" id="heatmapLegendCells" aria-hidden="true"></div>
        <span>More</span>
      </div>
    </section>
  </main>

  <div id="heatmapTooltip" class="heatmap-tooltip" role="status" aria-live="polite"></div>

  <script src="heatmap.js"></script>
</body>
</html>
