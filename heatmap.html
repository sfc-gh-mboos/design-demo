<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Heatmap - Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
        <a href="/heatmap" class="nav-link active">Heatmap</a>
      </nav>
    </div>
  </header>

  <main class="analytics-container heatmap-container">
    <section class="heatmap-page-heading">
      <h1>Activity Heatmap</h1>
    </section>

    <section class="heatmap-summary" aria-label="Activity summary">
      <div class="heatmap-summary-item">
        <div class="heatmap-summary-label">Current Streak</div>
        <div class="heatmap-summary-value">
          <span class="heatmap-summary-number" id="heatmapCurrentStreak">--</span>
          <span class="heatmap-summary-unit">days</span>
        </div>
      </div>
      <div class="heatmap-summary-item">
        <div class="heatmap-summary-label">Longest Streak</div>
        <div class="heatmap-summary-value">
          <span class="heatmap-summary-number" id="heatmapLongestStreak">--</span>
          <span class="heatmap-summary-unit">days</span>
        </div>
      </div>
      <div class="heatmap-summary-item">
        <div class="heatmap-summary-label">Total Completions</div>
        <div class="heatmap-summary-value">
          <span class="heatmap-summary-number" id="heatmapTotalCompletions">--</span>
        </div>
      </div>
    </section>

    <section class="heatmap-card" aria-label="Activity by day">
      <p class="heatmap-error" id="heatmapError" hidden>Unable to load heatmap right now.</p>
      <div class="heatmap-scroll">
        <div class="heatmap-board-inner">
          <div class="heatmap-month-row" id="heatmapMonthRow"></div>
          <div id="heatmapRows"></div>
        </div>
      </div>

      <div class="heatmap-legend">
        <span class="heatmap-legend-text">Less</span>
        <div class="heatmap-legend-cells" id="heatmapLegendCells"></div>
        <span class="heatmap-legend-text">More</span>
      </div>
    </section>
  </main>

  <script src="heatmap.js"></script>
</body>
</html>
