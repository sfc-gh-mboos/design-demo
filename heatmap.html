<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Heatmap - Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
        <a href="/heatmap" class="nav-link active">Heatmap</a>
      </nav>
    </div>
  </header>

  <main class="heatmap-container" aria-label="Activity heatmap page">
    <section class="heatmap-header" aria-labelledby="heatmapTitle">
      <h1 id="heatmapTitle">Activity Heatmap</h1>
      <div class="heatmap-summary" aria-label="Heatmap summary stats">
        <article class="heatmap-stat">
          <span class="heatmap-stat-label">Current Streak</span>
          <p class="heatmap-stat-value"><span id="currentStreak">0</span> <span class="heatmap-stat-unit">days</span></p>
        </article>
        <article class="heatmap-stat">
          <span class="heatmap-stat-label">Longest Streak</span>
          <p class="heatmap-stat-value"><span id="longestStreak">0</span> <span class="heatmap-stat-unit">days</span></p>
        </article>
        <article class="heatmap-stat">
          <span class="heatmap-stat-label">Total Completions</span>
          <p class="heatmap-stat-value" id="totalCompletions">0</p>
        </article>
      </div>
    </section>

    <section class="heatmap-card" aria-label="Completion activity grid">
      <div class="heatmap-grid-shell">
        <div id="monthLabels" class="heatmap-month-labels" aria-hidden="true"></div>
        <div class="heatmap-grid-body">
          <div class="heatmap-day-labels" aria-hidden="true">
            <span>Mon</span>
            <span>Wed</span>
            <span>Fri</span>
            <span>Sun</span>
          </div>
          <div id="heatmapGrid" class="heatmap-grid" role="grid" aria-label="Task completion heatmap"></div>
        </div>
      </div>
      <div class="heatmap-legend" aria-hidden="true">
        <span>Less</span>
        <div class="heatmap-legend-scale">
          <span class="heatmap-cell intensity-0"></span>
          <span class="heatmap-cell intensity-1"></span>
          <span class="heatmap-cell intensity-2"></span>
          <span class="heatmap-cell intensity-3"></span>
          <span class="heatmap-cell intensity-4"></span>
          <span class="heatmap-cell intensity-5"></span>
        </div>
        <span>More</span>
      </div>
    </section>
  </main>

  <div id="heatmapTooltip" class="heatmap-tooltip" role="status" aria-live="polite"></div>
  <script src="heatmap.js"></script>
</body>
</html>
