<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav" aria-label="Primary">
        <a href="/" class="nav-link active">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
      </nav>
      <button type="button" class="palette-trigger-btn" id="openPaletteBtn" title="Quick actions (⌘K)">
        <span class="palette-trigger-label">Quick actions</span>
        <kbd class="palette-kbd">⌘K</kbd>
      </button>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="assist-strip" id="assistStrip" role="region" aria-label="Suggestions">
      <div class="assist-strip-inner">
        <span class="assist-strip-icon" aria-hidden="true">✦</span>
        <p class="assist-strip-text" id="assistMessage">Loading suggestions…</p>
        <div class="assist-strip-actions" id="assistActions"></div>
      </div>
    </div>

    <section class="hero hero--home" aria-labelledby="heroTitle">
      <div class="hero-shell">
        <div class="hero-backdrop" aria-hidden="true"></div>
        <div class="hero-card">
          <div class="hero-visual" aria-hidden="true">
            <div class="hero-ring-wrap">
              <svg class="hero-ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="hero-ring-track" cx="60" cy="60" r="52"></circle>
                <circle id="heroRingArc" class="hero-ring-progress" cx="60" cy="60" r="52"
                  transform="rotate(-90 60 60)"></circle>
              </svg>
              <div class="hero-ring-center">
                <span class="hero-pct" id="heroPct">0</span><span class="hero-pct-unit">%</span>
              </div>
              <span class="hero-ring-caption">done</span>
            </div>
          </div>
          <div class="hero-main">
            <p class="hero-eyebrow">
              <span id="heroGreeting">Hello</span>
              <span class="hero-eyebrow-sep">·</span>
              <time id="dateLabel" class="date-label"></time>
            </p>
            <h1 id="heroTitle">Your tasks at a glance</h1>
            <p class="hero-subtitle">Tip: press <kbd class="inline-kbd">⌘K</kbd> anytime for navigation and shortcuts.</p>
            <ul class="hero-stats" aria-label="Task counts">
              <li class="hero-stat">
                <span class="hero-stat-value" id="heroStatTodo">0</span>
                <span class="hero-stat-label">To do</span>
              </li>
              <li class="hero-stat">
                <span class="hero-stat-value" id="heroStatProgress">0</span>
                <span class="hero-stat-label">In progress</span>
              </li>
              <li class="hero-stat">
                <span class="hero-stat-value" id="heroStatDone">0</span>
                <span class="hero-stat-label">Done</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <form class="quick-add" id="quickAddForm" aria-label="Quick add task">
      <input
        id="quickAddInput"
        class="quick-add-input"
        type="text"
        placeholder="Add a task, press Enter…"
        autocomplete="off"
        aria-label="Task title"
      >
      <select id="quickAddCategory" class="quick-add-select" aria-label="Category">
        <option value="Planning">Planning</option>
        <option value="Design">Design</option>
        <option value="Engineering">Engineering</option>
        <option value="Operations">Operations</option>
      </select>
      <select id="quickAddPriority" class="quick-add-select" aria-label="Priority">
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="low">Low</option>
      </select>
      <button type="submit" class="quick-add-submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filters" id="filters" role="tablist" aria-label="Filter by status">
          <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="filter-btn" data-filter="todo" role="tab" aria-selected="false">To Do</button>
          <button type="button" class="filter-btn" data-filter="in-progress" role="tab" aria-selected="false">In Progress</button>
          <button type="button" class="filter-btn" data-filter="done" role="tab" aria-selected="false">Done</button>
        </div>
      </div>
      <div class="view-toggle" id="viewToggle" role="tablist" aria-label="Task view">
        <button class="view-toggle-btn active" type="button" data-view="list" role="tab" aria-selected="true">List</button>
        <button class="view-toggle-btn" type="button" data-view="board" role="tab" aria-selected="false">Board</button>
      </div>
      <button class="add-task-btn" id="addTaskBtn" type="button" aria-label="Add task with full form">+ Details</button>
    </div>

    <section class="list-view" id="listView" aria-label="Task list">
      <ul class="task-list" id="taskList"></ul>
    </section>

    <section class="board-view hidden" id="boardView" aria-label="Kanban board">
      <article class="board-column" data-board-column="todo">
        <header class="board-column-header">
          <h2 class="board-column-title">To Do</h2>
          <span class="board-column-count" data-column-count="todo">0</span>
        </header>
        <div class="board-column-body" data-column-body="todo"></div>
      </article>

      <article class="board-column" data-board-column="in-progress">
        <header class="board-column-header">
          <h2 class="board-column-title">In Progress</h2>
          <span class="board-column-count" data-column-count="in-progress">0</span>
        </header>
        <div class="board-column-body" data-column-body="in-progress"></div>
      </article>

      <article class="board-column" data-board-column="done">
        <header class="board-column-header">
          <h2 class="board-column-title">Done</h2>
          <span class="board-column-count" data-column-count="done">0</span>
        </header>
        <div class="board-column-body" data-column-body="done"></div>
      </article>
    </section>
  </main>

  <div class="modal-overlay hidden" id="addTaskModal">
    <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <header class="modal-header">
        <h2 id="modalTitle" class="modal-title">New Task</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      </header>
      <form id="addTaskForm" class="modal-body">
        <label class="form-label" for="taskTitleInput">Description</label>
        <input
          id="taskTitleInput"
          class="form-input"
          type="text"
          placeholder="What needs to be done?"
          required
          autocomplete="off"
        >
        <label class="form-label" for="taskCategorySelect">Category</label>
        <select id="taskCategorySelect" class="form-select">
          <option value="Planning">Planning</option>
          <option value="Design">Design</option>
          <option value="Engineering">Engineering</option>
          <option value="Operations">Operations</option>
        </select>
        <label class="form-label" for="taskPrioritySelect">Priority</label>
        <select id="taskPrioritySelect" class="form-select">
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
        <button type="submit" class="form-submit">Add Task</button>
      </form>
    </div>
  </div>

  <script src="assistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
