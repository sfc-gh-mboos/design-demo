<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function() {
      var theme = localStorage.getItem("theme");
      if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav">
        <a href="/" class="nav-link active">Tasks</a>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Daily Tasks</h1>
      <p class="subtitle">Stay on track. One task at a time. <span id="dateLabel"></span></p>
    </section>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filters" id="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="todo">To Do</button>
          <button class="filter-btn" data-filter="in-progress">In Progress</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search tasks"
          aria-label="Search tasks"
        >
      </div>
      <div class="view-toggle" id="viewToggle" role="tablist" aria-label="Task view">
        <button class="view-toggle-btn active" type="button" data-view="list" role="tab" aria-selected="true">List</button>
        <button class="view-toggle-btn" type="button" data-view="board" role="tab" aria-selected="false">Board</button>
      </div>
      <span class="task-count" id="taskCount"></span>
    </div>

    <section class="list-view" id="listView" aria-label="Task list">
      <ul class="task-list" id="taskList"></ul>
    </section>

    <section class="board-view hidden" id="boardView" aria-label="Kanban board">
      <article class="board-column" data-board-column="todo">
        <header class="board-column-header">
          <h2 class="board-column-title">To Do</h2>
          <span class="board-column-count" data-column-count="todo">0</span>
        </header>
        <div class="board-column-body" data-column-body="todo"></div>
      </article>

      <article class="board-column" data-board-column="in-progress">
        <header class="board-column-header">
          <h2 class="board-column-title">In Progress</h2>
          <span class="board-column-count" data-column-count="in-progress">0</span>
        </header>
        <div class="board-column-body" data-column-body="in-progress"></div>
      </article>

      <article class="board-column" data-board-column="done">
        <header class="board-column-header">
          <h2 class="board-column-title">Done</h2>
          <span class="board-column-count" data-column-count="done">0</span>
        </header>
        <div class="board-column-body" data-column-body="done"></div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
