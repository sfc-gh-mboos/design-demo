<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav" id="topbarNav">
        <a href="/" class="nav-link active">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
      </nav>
      <div class="profile-actions hidden" id="profileActions">
        <span class="profile-name" id="profileName"></span>
        <button class="logout-btn" id="logoutBtn" type="button">Log out</button>
      </div>
    </div>
  </header>

  <section class="auth-panel" id="authPanel" aria-labelledby="authTitle">
    <div class="auth-card">
      <p class="auth-eyebrow">Personal workspace</p>
      <h1 id="authTitle">Create your Taskflow profile</h1>
      <p class="auth-copy">Sign up or log in to keep your tasks and productivity stats private.</p>
      <div class="auth-toggle" role="tablist" aria-label="Authentication mode">
        <button class="auth-toggle-btn active" id="signupModeBtn" type="button" data-auth-mode="signup" role="tab" aria-selected="true">Sign up</button>
        <button class="auth-toggle-btn" id="loginModeBtn" type="button" data-auth-mode="login" role="tab" aria-selected="false">Log in</button>
      </div>
      <form class="auth-form" id="authForm">
        <div class="auth-name-field" id="authNameField">
          <label class="form-label" for="authNameInput">Name</label>
          <input id="authNameInput" class="form-input" type="text" autocomplete="name" placeholder="Ada Lovelace">
        </div>
        <label class="form-label" for="authEmailInput">Email</label>
        <input id="authEmailInput" class="form-input" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label class="form-label" for="authPasswordInput">Password</label>
        <input id="authPasswordInput" class="form-input" type="password" autocomplete="current-password" minlength="8" required>
        <p class="auth-error" id="authError" role="alert"></p>
        <button class="form-submit" id="authSubmitBtn" type="submit">Create profile</button>
      </form>
    </div>
  </section>

  <main class="container app-shell hidden" id="appShell">
    <section class="hero hero--tasks" aria-labelledby="heroTitle">
      <h1 id="heroTitle">Daily Tasks</h1>
    </section>

    <section class="personal-stats" id="personalStats" aria-label="Personal stats">
      <article class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Total tasks</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="statCompletion">0%</span>
        <span class="stat-label">Completion</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="statDone">0</span>
        <span class="stat-label">Done</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="statHighPriority">0</span>
        <span class="stat-label">High priority</span>
      </article>
    </section>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filters" id="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="todo">To Do</button>
          <button class="filter-btn" data-filter="in-progress">In Progress</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>
      </div>
      <div class="view-toggle" id="viewToggle" role="tablist" aria-label="Task view">
        <button class="view-toggle-btn active" type="button" data-view="list" role="tab" aria-selected="true">List</button>
        <button class="view-toggle-btn" type="button" data-view="board" role="tab" aria-selected="false">Board</button>
      </div>
      <button class="add-task-btn" id="addTaskBtn" type="button" aria-label="Add task">+ Add Task</button>
    </div>

    <section class="list-view" id="listView" aria-label="Task list">
      <ul class="task-list" id="taskList"></ul>
    </section>

    <section class="board-view hidden" id="boardView" aria-label="Kanban board">
      <article class="board-column" data-board-column="todo">
        <header class="board-column-header">
          <h2 class="board-column-title">To Do</h2>
          <span class="board-column-count" data-column-count="todo">0</span>
        </header>
        <div class="board-column-body" data-column-body="todo"></div>
      </article>

      <article class="board-column" data-board-column="in-progress">
        <header class="board-column-header">
          <h2 class="board-column-title">In Progress</h2>
          <span class="board-column-count" data-column-count="in-progress">0</span>
        </header>
        <div class="board-column-body" data-column-body="in-progress"></div>
      </article>

      <article class="board-column" data-board-column="done">
        <header class="board-column-header">
          <h2 class="board-column-title">Done</h2>
          <span class="board-column-count" data-column-count="done">0</span>
        </header>
        <div class="board-column-body" data-column-body="done"></div>
      </article>
    </section>
  </main>

  <div class="modal-overlay hidden" id="addTaskModal">
    <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <header class="modal-header">
        <h2 id="modalTitle" class="modal-title">New Task</h2>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      </header>
      <form id="addTaskForm" class="modal-body">
        <label class="form-label" for="taskTitleInput">Description</label>
        <input
          id="taskTitleInput"
          class="form-input"
          type="text"
          placeholder="What needs to be done?"
          required
          autocomplete="off"
        >
        <label class="form-label" for="taskCategorySelect">Category</label>
        <select id="taskCategorySelect" class="form-select">
          <option value="Planning">Planning</option>
          <option value="Design">Design</option>
          <option value="Engineering">Engineering</option>
          <option value="Operations">Operations</option>
        </select>
        <label class="form-label" for="taskPrioritySelect">Priority</label>
        <select id="taskPrioritySelect" class="form-select">
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
        <button type="submit" class="form-submit">Add Task</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
