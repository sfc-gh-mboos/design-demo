<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Taskflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Taskflow</span>
      </div>
      <nav class="topbar-nav" id="topbarNav">
        <a href="/" class="nav-link">Tasks</a>
        <a href="/analytics" class="nav-link">Analytics</a>
        <a href="/metrics" class="nav-link">My Metrics</a>
      </nav>
      <div class="auth-status" id="authStatus" data-state="anonymous">
        <a href="/signup" class="auth-link">Sign up</a>
      </div>
    </div>
  </header>

  <main class="auth-container">
    <section class="auth-card" aria-labelledby="authTitle">
      <h1 id="authTitle" class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to access your tasks and personalized metrics.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <label class="form-label" for="loginUsername">Username</label>
        <input
          id="loginUsername"
          class="form-input"
          name="username"
          type="text"
          autocomplete="username"
          required
          minlength="3"
          maxlength="32"
        >

        <label class="form-label" for="loginPassword">Password</label>
        <input
          id="loginPassword"
          class="form-input"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit" class="form-submit auth-submit">Log in</button>
        <p class="auth-error" id="authError" role="alert" hidden></p>
      </form>

      <p class="auth-switch">
        New here? <a href="/signup">Create a profile</a>
      </p>
    </section>
  </main>

  <script src="auth-status.js"></script>
  <script src="login.js"></script>
</body>
</html>
